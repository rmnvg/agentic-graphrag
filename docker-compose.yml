services:
  api:
    build: .
    container_name: agentic-graphrag-api

    ports:
      - "8000:8000"

    environment:
      GROQ_API_KEY: ${API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      GUARDRAIL_ENABLED: ${GUARDRAIL_ENABLED:-false}
      GUARDRAIL_INPUT_ENABLED: ${GUARDRAIL_INPUT_ENABLED:-false}
      GUARDRAIL_OUTPUT_ENABLED: ${GUARDRAIL_OUTPUT_ENABLED:-false}
      GUARDRAIL_INPUT_FAIL_MODE: ${GUARDRAIL_INPUT_FAIL_MODE:-open}
      GUARDRAIL_OUTPUT_FAIL_MODE: ${GUARDRAIL_OUTPUT_FAIL_MODE:-open}
      GUARDRAIL_TIMEOUT_SECONDS: ${GUARDRAIL_TIMEOUT_SECONDS:-2}
      GUARDRAIL_MODEL: ${GUARDRAIL_MODEL:-openai/gpt-oss-safeguard-20b}

    volumes:
      - .:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: agentic-graphrag-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
